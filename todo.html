<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            background:linear-gradient(135deg,#74ebd5,#9face6);
        }

        .todo{
            width:360px;
            min-height:580px;
            background:#111827;
            border-radius:20px;
            padding:30px 25px;
            box-shadow:0 15px 35px rgba(0,0,0,0.4);
            display:flex;
            flex-direction:column;
        }

        h1{
            text-align:center;
            color:#ffffff;
            font-size:30px;
            margin-bottom:30px;
        }

        .top{
            display:flex;
            gap:10px;
        }

        input{
            flex:1;
            padding:12px;
            font-size:16px;
            border:2px solid #374151;
            border-radius:10px;
            outline:none;
            background:#1f2937;
            color:#ffffff;
            transition:0.3s;
        }

        input::placeholder{
            color:#9ca3af;
        }

        input:focus{
            border-color:#3b82f6;
        }

        .add-btn{
            padding:12px 18px;
            border:none;
            border-radius:10px;
            background:linear-gradient(to right,#3b82f6,#2563eb);
            color:white;
            font-size:15px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .add-btn:hover{
            transform:scale(1.05);
        }

        .list{
            margin-top:25px;
            flex:1;
            overflow-y:auto;
            padding-right:5px;
        }

        .list::-webkit-scrollbar{
            width:6px;
        }

        .list::-webkit-scrollbar-thumb{
            background:#3b82f6;
            border-radius:10px;
        }

        .item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#1f2937;
            border-left:6px solid #3b82f6;
            padding:14px;
            border-radius:10px;
            margin-bottom:12px;
            transition:0.3s;
        }

        .item:hover{
            transform:translateX(5px);
            box-shadow:0 5px 12px rgba(0,0,0,0.25);
        }

        .item p{
            flex:1;
            color:#ffffff;
            font-size:16px;
            word-break:break-word;
        }

        .delete-btn{
            border:none;
            background:#ef4444;
            color:white;
            padding:8px 14px;
            border-radius:8px;
            cursor:pointer;
            transition:0.3s;
        }

        .delete-btn:hover{
            background:#b91c1c;
        }
    </style>
</head>

<body>

    <div class="todo">
        <h1>📋 My Tasks</h1>
    </div>

    <script src="todo.js"></script>

</body>
</html>
